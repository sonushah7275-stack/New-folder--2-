<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="forest-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A2342"/>
      <stop offset="60%" stop-color="#1F3A4B"/>
      <stop offset="100%" stop-color="#F5F3EF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#forest-bg)"/>
  <!-- Misty sunbeams -->
  <polygon points="600,0 1000,800 400,800" fill="#D4AF37" opacity="0.15"/>
  <!-- Trees Layer 1 -->
  <polygon points="200,800 280,350 360,800" fill="#0A2342" opacity="0.7"/>
  <polygon points="500,800 580,280 660,800" fill="#0A2342" opacity="0.8"/>
  <polygon points="800,800 880,320 960,800" fill="#0A2342" opacity="0.7"/>
  <!-- Trees Layer 2 -->
  <polygon points="100,800 180,450 260,800" fill="#B87333" opacity="0.3"/>
  <polygon points="380,800 440,380 500,800" fill="#B87333" opacity="0.3"/>
  <polygon points="680,800 750,390 820,800" fill="#B87333" opacity="0.3"/>
  <rect y="720" width="1200" height="80" fill="#0A2342"/>
</svg>
