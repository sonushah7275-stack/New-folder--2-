<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="studio-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3EF"/>
      <stop offset="60%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#0A2342"/>
    </linearGradient>
    <linearGradient id="wood-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B87333" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0A2342" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#studio-bg)"/>
  <!-- Organic Architecture Arch Windows -->
  <path d="M150,100 C150,40 350,40 350,100 L350,600 L150,600 Z" fill="#D4AF37" opacity="0.15" stroke="#B87333" stroke-width="2"/>
  <path d="M450,80 C450,20 750,20 750,80 L750,600 L450,600 Z" fill="#D4AF37" opacity="0.25" stroke="#D4AF37" stroke-width="2"/>
  <path d="M850,100 C850,40 1050,40 1050,100 L1050,600 L850,600 Z" fill="#D4AF37" opacity="0.15" stroke="#B87333" stroke-width="2"/>
  <!-- Sunbeams flowing through arch windows -->
  <polygon points="600,50 1200,800 200,800" fill="#D4AF37" opacity="0.18"/>
  <!-- Floor -->
  <rect y="580" width="1200" height="220" fill="url(#wood-floor)"/>
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#B87333" stroke-width="3" opacity="0.6"/>
  <!-- Yoga / Mindful Movement Figure silhouette -->
  <g transform="translate(600, 520)" fill="#0A2342">
    <circle cx="0" cy="-90" r="18" fill="#0A2342"/>
    <path d="M-8,-68 C-25,-30 -35,0 -40,30 L-20,30 C-15,10 -5,-20 0,-50 C5,-20 15,10 20,30 L40,30 C35,0 25,-30 8,-68 Z"/>
    <path d="M-45,-45 C-15,-65 0,-70 45,-45" stroke="#B87333" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
